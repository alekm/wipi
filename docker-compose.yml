services:
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    container_name: wipi-controller
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/wipi.db
      - SCENARIO_DIR=/app/scenarios
      - POLL_INTERVAL_SECONDS=10
      - PI_TIMEOUT_SECONDS=30
      # Set container timezone for logs and localtime; adjust as needed
      - TZ=America/New_York
      # Agent API key for agent-to-controller authentication
      # Generate: openssl rand -hex 32
      - AGENT_API_KEY=${AGENT_API_KEY:-387d5f76c069bc167dc3ba74b1adb2b25233e9874e369dfa436894c3906bad0e}
    volumes:
      - ./data:/app/data
      - ./controller/scenarios:/app/scenarios
      - ./controller:/app/controller
      - ./shared:/app/shared
    restart: unless-stopped
    networks:
      - wipi-network

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        # Admin password hash (SHA-256) for UI
        # Default: "Ruckus123!"
        # Generate: echo -n "YourPassword" | sha256sum
        VITE_ADMIN_PASSWORD_HASH: ${WIPI_ADMIN_PASSWORD_HASH:-8f4179b458b4e4622c32089b025ff4e4b531137642dfdf5143b5f29af3c32e84}
    container_name: wipi-ui
    depends_on:
      - controller
    environment:
      # Match controller timezone for consistent logging
      - TZ=America/New_York
    ports:
      - "8080:80"
    networks:
      - wipi-network

  # Optional: Redis for caching/message queue
  # redis:
  #   image: redis:7-alpine
  #   container_name: wipi-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
  #   networks:
  #     - wipi-network

networks:
  wipi-network:
    driver: bridge

volumes:
  data:
  scenarios:
